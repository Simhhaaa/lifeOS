[project]
name = "lifeos-backend"
version = "0.1.0"
description = "LIFEOS API (FastAPI). Private, single-owner."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=0.24", "pyyaml>=6", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]
