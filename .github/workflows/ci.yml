name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos-local-only
          POSTGRES_DB: lifeos_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Tests (incl. OpenAPI contract test and alembic check)
        env:
          LIFEOS_TEST_DATABASE_URL: postgresql+asyncpg://lifeos:lifeos-local-only@127.0.0.1:54329/lifeos_test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen   # generated route types (e.g. LayoutProps) needed by tsc
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
